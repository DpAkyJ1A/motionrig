name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC): no token, provenance included

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency cache in the job that publishes: a poisoned cache would ship to npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+, and Node 22 comes with npm 10. pnpm publish
      # packs the package and hands the tarball to this npm.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Opens a "Version packages" PR while changesets are pending; once that PR
      # is merged, publishes the new version to npm.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
